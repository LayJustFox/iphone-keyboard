plugins {
    id 'com.android.application'
}

android {
    namespace 'com.iphonekb'
    compileSdk 34

    defaultConfig {
        applicationId 'com.iphonekb'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName "3.1"
        // Phones only (no emulator x86 code): keeps the translator's native code small.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    // The key lives in the repo so every build (GitHub or Android Studio)
    // is signed the same way and installs over the previous version.
    signingConfigs {
        release {
            storeFile file('keyboard.jks')
            storePassword 'iphonekb'
            keyAlias 'keyboard'
            keyPassword 'iphonekb'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // On-device translation and language detection (models are downloaded once, text stays on the phone)
    implementation 'com.google.mlkit:translate:17.0.3'
    implementation 'com.google.mlkit:language-id:17.0.6'
}
